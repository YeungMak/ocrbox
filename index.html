<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片轉文字工具 (OCR)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        input[type="file"], select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #status {
            margin-bottom: 15px;
            font-weight: bold;
            color: #d9534f;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }
        .preview-container {
            margin-bottom: 20px;
            text-align: center;
        }
        #imagePreview {
            max-width: 100%;
            max-height: 300px;
            display: none;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>圖片轉文字工具 (OCR)</h1>
    
    <div class="controls">
        <input type="file" id="imageInput" accept="image/*">
        <select id="langSelect">
            <option value="chi_tra">繁體中文</option>
            <option value="chi_sim">簡體中文</option>
            <option value="eng">英文</option>
            <option value="chi_tra+eng">繁體中文 + 英文</option>
        </select>
        <button id="convertBtn">開始轉換</button>
    </div>

    <div class="preview-container">
        <img id="imagePreview" alt="預覽圖片">
    </div>

    <div id="status">等待上傳圖片...</div>
    
    <textarea id="result" placeholder="轉換後的文字會顯示在這裡..."></textarea>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const langSelect = document.getElementById('langSelect');
    const convertBtn = document.getElementById('convertBtn');
    const statusDiv = document.getElementById('status');
    const resultArea = document.getElementById('result');

    // 圖片預覽功能
    imageInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'inline-block';
                statusDiv.textContent = '圖片已載入，請點擊「開始轉換」。';
            }
            reader.readAsDataURL(file);
        } else {
            imagePreview.style.display = 'none';
        }
    });

    // 轉換按鈕點擊事件
    convertBtn.addEventListener('click', async () => {
        if (!imageInput.files || imageInput.files.length === 0) {
            alert('請先選擇一張圖片！');
            return;
        }

        const file = imageInput.files[0];
        const lang = langSelect.value;

        // 更新 UI 狀態
        statusDiv.style.color = '#007bff';
        statusDiv.textContent = '正在下載語言包並準備識別 (初次執行可能需要幾秒鐘)...';
        resultArea.value = '';
        convertBtn.disabled = true;

        try {
            // 使用 Tesseract.js 進行識別
            const result = await Tesseract.recognize(
                file,
                lang,
                {
                    logger: m => {
                        console.log(m);
                        if (m.status === 'recognizing text') {
                            statusDiv.textContent = `識別中: ${Math.round(m.progress * 100)}%`;
                        } else {
                            // 顯示其他狀態，例如載入語言模型
                            statusDiv.textContent = `狀態: ${m.status}...`;
                        }
                    }
                }
            );

            // 顯示結果
            resultArea.value = result.data.text;
            statusDiv.style.color = 'green';
            statusDiv.textContent = '轉換完成！';

        } catch (error) {
            console.error(error);
            statusDiv.style.color = 'red';
            statusDiv.textContent = '發生錯誤，請重新整理頁面或檢查圖片格式。';
        } finally {
            convertBtn.disabled = false;
        }
    });
</script>

</body>
</html>
